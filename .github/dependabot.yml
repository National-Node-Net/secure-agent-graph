version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    target-branch: develop

  - package-ecosystem: "docker"
    directory: "/sag-docker"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    target-branch: develop

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    target-branch: develop
    groups:
      all-actions:
        patterns: ["*"]
