name: Build and Push Container

on:
  workflow_call:
    inputs:
      image-tag-suffix:
        description: Optional suffix appended to the Maven project version
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    env:
      MAVEN_CLI_OPTS: --batch-mode --no-transfer-progress
      IMAGE_TAG_SUFFIX: ${{ inputs['image-tag-suffix'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GH_PACKAGES_PAT }}</password></server></servers></settings>" > ~/.m2/settings.xml

      - name: Build with Maven
        id: maven
        run: |
          mvn clean install $MAVEN_CLI_OPTS -Dgpg.skip=true -Dlicense.skip=true
          PROJECT_VERSION=$(mvn -q -f pom.xml -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          echo "project_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Retain target outputs
        uses: actions/upload-artifact@v7
        with:
          name: all-targets
          path: '**/target/'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecr-access-for-github
          aws-region: ${{ secrets.AWS_REGION }}
          role-skip-session-tagging: true
          role-duration-seconds: 3600

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image details
        env:
          PROJECT_VERSION: ${{ steps.maven.outputs.project_version }}
        run: |
          echo "IMAGE_REPOSITORY=${{ steps.login-ecr.outputs.registry }}/ndtp/secure-agent-graph" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${PROJECT_VERSION}${IMAGE_TAG_SUFFIX:+-${IMAGE_TAG_SUFFIX}}" >> "$GITHUB_ENV"

      - name: Build container
        run: |
          echo "Building image: $IMAGE_REPOSITORY:$IMAGE_TAG"
          docker build --no-cache \
            --build-arg PROJECT_VERSION="${{ steps.maven.outputs.project_version }}" \
            --tag "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --file "${{ github.workspace }}/sag-docker/Dockerfile" .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Push container to ECR
        run: docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
