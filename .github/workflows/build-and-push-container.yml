name: Build and Push Container

on:
  workflow_call:
    inputs:
      generate-standard-tags:
        description: Create timestamp and commit-SHA image tags in addition to the latest tag
        required: false
        default: true
        type: boolean
      extra-tags:
        description: Optional space-separated tags appended to the Maven project version
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    env:
      MAVEN_CLI_OPTS: --batch-mode --no-transfer-progress
      GENERATE_STANDARD_TAGS: ${{ inputs.generate-standard-tags }}
      EXTRA_TAGS: ${{ inputs.extra-tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GH_PACKAGES_PAT }}</password></server></servers></settings>" > ~/.m2/settings.xml

      # - name: Build with Maven
      #   id: maven
      #   run: |
      #     mvn clean install $MAVEN_CLI_OPTS -Dgpg.skip=true -Dlicense.skip=true
      #     PROJECT_VERSION=$(mvn -q -f pom.xml -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
      #     echo "project_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Retain target outputs
        uses: actions/upload-artifact@v7
        with:
          name: all-targets
          path: '**/target/'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecr-access-for-github
          aws-region: ${{ secrets.AWS_REGION }}
          role-skip-session-tagging: true
          role-duration-seconds: 3600

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image details
        env:
          PROJECT_VERSION: "0.0.0" # ${{ steps.maven.outputs.project_version }}
        run: |

          IMAGE_REPOSITORY="${{ steps.login-ecr.outputs.registry }}/ndtp/secure-agent-graph"

          tagsArray=()
          tagsArray+=("${IMAGE_REPOSITORY}:${PROJECT_VERSION}")      

          if [[ "$GENERATE_STANDARD_TAGS" == "true" ]]; then
            tagsArray+=("${IMAGE_REPOSITORY}:${PROJECT_VERSION}-$(date -u +'%Y%m%d%H%M%S')") 
            tagsArray+=("${IMAGE_REPOSITORY}:${PROJECT_VERSION}-${GITHUB_SHA}")
            tagsArray+=("${IMAGE_REPOSITORY}:${PROJECT_VERSION}-${EXTRA_TAGS}")
          fi

          echo "image_tags=${tagsArray[*]}" >> "$GITHUB_ENV"

          cat $GITHUB_ENV

      - name: Build container
        run: |
          for image_tag in $image_tags; do
            tag_cli+=(--tag "$image_tag")
          done

          printf 'tag_cli item: <%s>\n' "${tag_cli[@]}"

          docker build --no-cache \
            --build-arg PROJECT_VERSION="${{ steps.maven.outputs.project_version }}" \
            "${tag_cli[@]}" \
            --file "${{ github.workspace }}/sag-docker/Dockerfile" .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: "${image_tags%% *}"
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Push container to ECR
        run: |
          for image_tag in $image_tags; do
            echo docker push "$image_tag"
          done
