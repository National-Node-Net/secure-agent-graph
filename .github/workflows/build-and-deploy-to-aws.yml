name: Build and Push Dev Container
on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ !contains(github.ref_name, 'release/') }}

permissions:
  contents: read
  id-token: write

jobs:
  image-metadata:
    name: Generate image tag suffix
    runs-on: ubuntu-latest
    outputs:
      image-tag-suffix: ${{ steps.tag.outputs.image-tag-suffix }}
    steps:
      - name: Generate image tag suffix
        id: tag
        shell: bash
        run: echo "image-tag-suffix=$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-scan-push:
    name: Build and push development image
    needs: image-metadata
    uses: ./.github/workflows/build-and-push-container.yml
    with:
      image-tag-env: dev
      image-tag-suffix: ${{ needs.image-metadata.outputs.image-tag-suffix }}
    secrets: inherit
