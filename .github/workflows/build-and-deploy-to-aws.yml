name: Build and Push Dev Container
on:
  push:
    branches:
      - feature/dpav501-cicd-images
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ !contains(github.ref_name, 'release/') }}

permissions:
  contents: read
  id-token: write

jobs:
   build-scan-push:
    name: Build and push development image
    uses: ./.github/workflows/build-and-push-container.yml
    with:
      generate-standard-tags: true
      extra-tags: "dev-latest"
    secrets: inherit
