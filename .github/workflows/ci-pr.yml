name: CI on pull request

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
env:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # Fetch the full history required for accurate SonarCloud pull-request analysis.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      # Install the project JDK and restore Maven dependencies from the cache.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-password: GH_PACKAGES_PAT

      # Compile the application and run its test suite.
      - name: Build and test
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: mvn clean verify $MAVEN_CLI_OPTS -Dgpg.skip=true -Dlicense.skip=true

      # Send the coverage report produced by the verified build to SonarCloud.
      - name: Publish coverage to SonarCloud
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_N3 }}
        run: mvn $MAVEN_CLI_OPTS verify -Dgpg.skip=true -Dlicense.skip=true -Dsonar.projectKey=National-Node-Net_secure-agent-graph -Dsonar.organization=national-node-net -Dsonar.coverage.jacoco.xmlReportPaths=sag-system/target/site/jacoco/jacoco.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      # Fail early if Maven did not generate the coverage report expected by SonarCloud.
      - name: Verify JaCoCo XML exists
        run: test -f sag-system/target/site/jacoco/jacoco.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fetch the source used by the formatting check.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Install the project JDK and restore Maven dependencies from the cache.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-password: GH_PACKAGES_PAT

      # Check source formatting without modifying the working tree.
      - name: Run Spotless
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: ./mvnw $MAVEN_CLI_OPTS spotless:check

  docker-build-test-scan:
    name: Docker build and vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fetch the Dockerfile and source used by the image build.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Install Java and restore Maven dependencies needed to build the image inputs.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-password: GH_PACKAGES_PAT

      # Build the Docker module's dependency, agent, and SBOM outputs on this runner.
      - name: Build Maven artifacts for the image
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        run: mvn clean install $MAVEN_CLI_OPTS -Dgpg.skip=true -Dlicense.skip=true

      # Read the Maven version used in the image tag and SBOM filename.
      - name: Get project version
        id: get-version
        run: echo "project_version=$(mvn $MAVEN_CLI_OPTS help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      # Build the production runtime image locally for vulnerability scanning.
      - name: Build image
        run: docker build --no-cache --build-arg PROJECT_VERSION="${{ steps.get-version.outputs.project_version }}" -t secure-agent-graph:ci -f sag-docker/Dockerfile .

      # Fail the workflow when the built image contains an unfixed critical or high vulnerability.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: secure-agent-graph:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      
